name: Panel operativo diario por email

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 1-5"
      timezone: "Europe/Madrid"

jobs:
  ejecutar-y-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar caché del calendario
        uses: actions/cache@v4
        with:
          path: salida_operativa/calendario_resultados/estado_fechas_v2_4.json
          key: calendario-resultados-v24-${{ github.run_id }}
          restore-keys: |
            calendario-resultados-v24-

      - name: Ejecutar panel operativo V2.4
        run: >-
          jupyter nbconvert --to notebook --execute
          "Vers_Operativa_Basada en 2_4_Config Multimercado.ipynb"
          --output "Resultado_Operativo_Diario_V2_4.ipynb"
          --ExecutePreprocessor.timeout=600

      - name: Enviar resumen por correo
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python enviar_resumen_operativo.py

      - name: Guardar diagnóstico si falla o para consulta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-operativo-diario
          path: |
            Resultado_Operativo_Diario_V2_4.ipynb
            salida_operativa/
          retention-days: 7
          if-no-files-found: warn
